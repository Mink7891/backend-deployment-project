                $ref: '#/components/schemas/ProblemDetails'
          headers:
            Retry-After:
              description: Секунды до повтора при отказе провайдера.
              schema:
                type: string
      description: Записи переходов через порог цены, новые первыми; limit/offset.
  /watchlists/{watchlist_id}/refresh:
    post:
      tags:
      - Watchlists
      summary: Обновить цены
      operationId: refreshWatchlist
      security:
      - APIKeyHeader: []
      parameters:
      - name: watchlist_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Watchlist Id
        description: Положительный идентификатор списка.
      responses:
        '200':
          description: Успешное выполнение.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '422':
          description: Неверные параметры запроса.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Неверный или отсутствующий API-ключ.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            WWW-Authenticate:
              description: Используемая схема аутентификации.
              schema:
                type: string
        '500':
          description: Внутренняя ошибка.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Ресурс не найден.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: БД или провайдер временно недоступны.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            Retry-After:
              description: Секунды до повтора при отказе провайдера.
              schema:
                type: string
      description: Обновление с учётом кеша; повторные уведомления не создаются до
        нового перехода.
  /health:
    get:
      tags:
      - Operations
      summary: Готовность сервиса
      operationId: health
      responses:
        '200':
          description: Успешное выполнение.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Внутренняя ошибка.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Неверные параметры запроса.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '503':
          description: БД или провайдер временно недоступны.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            Retry-After:
              description: Секунды до повтора при отказе провайдера.
              schema:
                type: string
      description: Проверка подключения и наличия схемы БД; без API-ключа.
components:
  schemas:
    AddItemRequest:
      properties:
        gameId:
          type: string
          pattern: ^[0-9]{1,32}$
          title: Gameid
          description: 'Идентификатор CheapShark: от 1 до 32 цифр, это не Steam App
            ID.'
        targetPrice:
          description: 'Порог цены USD: неотрицательное число, до 10 целых и 2 дробных
            цифр.'
          $ref: '#/components/schemas/MoneyTarget'
        steamOnly:
          type: boolean
          title: Steamonly
          default: true
          description: Учитывать только предложения магазина Steam.
      type: object
      required:
      - gameId
      - targetPrice
      title: AddItemRequest
      additionalProperties: false
      description: Добавление игры и порога цены в список.
    CreateWatchlistRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          description: Название списка, 1–100 символов.
          pattern: .*\S.*
      type: object
      required:
      - name
      title: CreateWatchlistRequest
      additionalProperties: false
      description: Создание списка наблюдения.
    GameCard:
      properties:
        id:
          type: string
          title: Id
          description: Идентификатор объекта.
        title:
          type: string
          title: Title
          description: Название игры.
        steamAppId:
          anyOf:
          - type: string
          - type: 'null'
          title: Steam App Id
          description: Идентификатор Steam App; null, если привязка отсутствует.
        thumbnailUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Thumbnail Url
          description: URL изображения игры; null, если изображения нет.
        cheapestPrice:
          description: Минимальная известная цена; null, если предложений нет.
          anyOf:
          - $ref: '#/components/schemas/DecimalValue'
          - type: 'null'
        currency:
          type: string
          const: USD
          title: Currency
          default: USD
          description: 'Валюта цены: USD.'
        source:
          type: string
          title: Source
          description: 'Источник данных: mock или cheapshark.'
          enum:
          - mock
          - cheapshark
      type: object
      required:
      - id
      - title
      - steamAppId
      - thumbnailUrl
      - cheapestPrice
      - source
      title: GameCard
      additionalProperties: false
      description: 'Данные GameRadar: GameCard.'
    GameDetails:
      properties:
        id:
          type: string
          title: Id
          description: Идентификатор объекта.
        title:
          type: string
          title: Title
          description: Название игры.
        steamAppId:
          anyOf:
          - type: string
          - type: 'null'
          title: Steam App Id
          description: Идентификатор Steam App; null, если привязка отсутствует.
        thumbnailUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Thumbnail Url
          description: URL изображения игры; null, если изображения нет.
        cheapestPrice:
          description: Минимальная известная цена; null, если предложений нет.
          anyOf:
          - $ref: '#/components/schemas/DecimalValue'
          - type: 'null'
        currency:
          type: string
          const: USD
          title: Currency
          default: USD
          description: 'Валюта цены: USD.'
        source:
          type: string
          title: Source
          description: 'Источник данных: mock или cheapshark.'
          enum:
          - mock
          - cheapshark
        lastRefreshedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Refreshed At
          description: Время последнего обновления в UTC; null до первого наблюдения.
        offers:
          items:
            $ref: '#/components/schemas/OfferResponse'
          type: array
          title: Offers
          description: Текущие предложения магазинов.
        bestPrice:
          description: Лучшая текущая цена или null.
          anyOf:
          - $ref: '#/components/schemas/DecimalValue'
          - type: 'null'
      type: object
      required:
      - id
      - title
      - steamAppId
      - thumbnailUrl
      - cheapestPrice
      - source
      - lastRefreshedAt
      - offers
      - bestPrice
      title: GameDetails
      additionalProperties: false
      description: 'Данные GameRadar: GameDetails.'
    ItemResponse:
      properties:
        id:
          type: integer
          title: Id
          description: Идентификатор объекта.
        gameId:
          type: string
          title: Game Id
          description: 'Идентификатор CheapShark: от 1 до 32 цифр, это не Steam App
            ID.'
        targetPrice:
          description: 'Порог цены USD: неотрицательное число, до 10 целых и 2 дробных
            цифр.'
          $ref: '#/components/schemas/DecimalValue'
        steamOnly:
          type: boolean
          title: Steam Only
          description: Учитывать только предложения магазина Steam.
        createdAt:
          type: string
          format: date-time
          title: Created At
          description: Время создания в UTC.
        game:
          $ref: '#/components/schemas/GameCard'
          description: Карточка игры.
        currentPrice:
          description: Лучшая цена с учётом steamOnly; null при отсутствии предложения.
          anyOf:
          - $ref: '#/components/schemas/DecimalValue'
          - type: 'null'
        thresholdMet:
          type: boolean
          title: Threshold Met
          description: Цена доступна и не превышает targetPrice.
      type: object
      required:
      - id
      - gameId
      - targetPrice
      - steamOnly
      - createdAt
      - game
      - currentPrice
      - thresholdMet
      title: ItemResponse
      additionalProperties: false
      description: 'Данные GameRadar: ItemResponse.'
    NotificationResponse:
      properties:
        id:
          type: integer
          title: Id
          description: Идентификатор объекта.
        watchlistId:
          type: integer
          title: Watchlist Id
          description: Идентификатор списка.
        itemId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Item Id
          description: Идентификатор позиции; null после её удаления.
        gameId:
          type: string
          title: Game Id
          description: 'Идентификатор CheapShark: от 1 до 32 цифр, это не Steam App
            ID.'
        gameTitle:
          type: string
          title: Game Title
          description: Название игры на момент уведомления.
        targetPrice:
          description: 'Порог цены USD: неотрицательное число, до 10 целых и 2 дробных
            цифр.'
          $ref: '#/components/schemas/DecimalValue'
        observedPrice:
          description: Цена, вызвавшая уведомление, в USD.
          $ref: '#/components/schemas/DecimalValue'
        createdAt:
          type: string
          format: date-time
          title: Created At
          description: Время создания в UTC.
      type: object
      required:
      - id
      - watchlistId
      - itemId
      - gameId
      - gameTitle
      - targetPrice
      - observedPrice
      - createdAt
      title: NotificationResponse
      additionalProperties: false
      description: 'Данные GameRadar: NotificationResponse.'
    OfferResponse:
      properties:
        dealId:
          type: string
          title: Deal Id
          description: Идентификатор предложения в источнике.
        storeId:
          type: string
          title: Store Id
          description: Идентификатор магазина.
        storeName:
          type: string
          title: Store Name
          description: Название магазина.
        price:
          description: Текущая цена предложения в USD.
          $ref: '#/components/schemas/DecimalValue'
        retailPrice:
          description: Обычная цена в USD.
          $ref: '#/components/schemas/DecimalValue'
        savings:
          description: Процент скидки.
          $ref: '#/components/schemas/DecimalValue'
        dealUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Deal Url
          description: URL покупки; null, если URL отсутствует.
      type: object
      required:
      - dealId
      - storeId
      - storeName
      - price
      - retailPrice
      - savings
      title: OfferResponse
      additionalProperties: false
      description: 'Данные GameRadar: OfferResponse.'
    RefreshResponse:
      properties:
        watchlistId:
          type: integer
          title: Watchlist Id
          description: Идентификатор списка.
        refreshedGames:
          type: integer
          title: Refreshed Games
          description: Количество игр, обновлённых у провайдера, без попаданий в кеш.
        checkedItems:
          type: integer
          title: Checked Items
          description: Количество проверенных позиций.
        matchedCount:
          type: integer
          title: Matched Count
          description: Количество игр, достигших порога цены.
        notificationsCreated:
          type: integer
          title: Notifications Created
          description: Количество новых записей уведомлений.
      type: object
      required:
      - watchlistId
      - refreshedGames
      - checkedItems
      - matchedCount
      - notificationsCreated
      title: RefreshResponse
      additionalProperties: false
      description: 'Данные GameRadar: RefreshResponse.'
    SnapshotResponse:
      properties:
        id:
          type: integer
          title: Id
          description: Идентификатор объекта.
        gameId:
          type: string
          title: Game Id
          description: 'Идентификатор CheapShark: от 1 до 32 цифр, это не Steam App
            ID.'
        storeId:
          type: string
          title: Store Id
          description: Идентификатор магазина.
        dealId:
          type: string
          title: Deal Id
          description: Идентификатор предложения в источнике.
        price:
          description: Текущая цена предложения в USD.
          $ref: '#/components/schemas/DecimalValue'
        observedAt:
          type: string
          format: date-time
          title: Observed At
          description: Время наблюдения цены в UTC.
        source:
          type: string
          title: Source
          description: 'Источник данных: mock или cheapshark.'
          enum:
          - mock
          - cheapshark
      type: object
      required:
      - id
      - gameId
      - storeId
      - dealId
      - price
      - observedAt
      - source
      title: SnapshotResponse
      additionalProperties: false
      description: 'Данные GameRadar: SnapshotResponse.'
    SummaryResponse:
      properties:
        watchlistId:
          type: integer
          title: Watchlist Id
          description: Идентификатор списка.
        totalItems:
          type: integer
          title: Total Items
          description: Количество игр в списке.
        pricedItems:
          type: integer
          title: Priced Items
          description: Количество игр с доступной ценой.
        matchedCount:
          type: integer
          title: Matched Count
          description: Количество игр, достигших порога цены.
        currentTotal:
          description: Сумма доступных цен игр списка в USD.
          $ref: '#/components/schemas/DecimalValue'
        currency:
          type: string
          const: USD
          title: Currency
          description: 'Валюта цены: USD.'
        source:
          type: string
          title: Source
          description: 'Источник цен: mock, cheapshark или mixed.'
          enum:
          - mock
          - cheapshark
          - mixed
      type: object
      required:
      - watchlistId
      - totalItems
      - pricedItems
      - matchedCount
      - currentTotal
      - currency
      - source
      title: SummaryResponse
      additionalProperties: false
      description: 'Данные GameRadar: SummaryResponse.'
    UpdateItemRequest:
      properties:
        targetPrice:
          description: 'Порог цены USD: неотрицательное число, до 10 целых и 2 дробных
            цифр.'
          $ref: '#/components/schemas/MoneyTarget'
        steamOnly:
          type: boolean
          description: Учитывать только предложения магазина Steam.
      type: object
      title: UpdateItemRequest
      additionalProperties: false
      description: Изменение хотя бы одного поля; null запрещён.
      minProperties: 1
    WatchlistDetails:
      properties:
        id:
          type: integer
          title: Id
          description: Идентификатор объекта.
        name:
          type: string
          title: Name
          description: Название списка, 1–100 символов.
        createdAt:
          type: string
          format: date-time
          title: Created At
          description: Время создания в UTC.
        items:
          items:
            $ref: '#/components/schemas/ItemResponse'
          type: array
          title: Items
          description: Игры списка наблюдения.
      type: object
      required:
      - id
      - name
      - createdAt
      - items
      title: WatchlistDetails
      additionalProperties: false
      description: 'Данные GameRadar: WatchlistDetails.'
    WatchlistResponse:
      properties:
        id:
          type: integer
          title: Id
          description: Идентификатор объекта.
        name:
          type: string
          title: Name
          description: Название списка, 1–100 символов.
        createdAt:
          type: string
          format: date-time
          title: Created At
          description: Время создания в UTC.
      type: object
      required:
      - id
      - name
      - createdAt
      title: WatchlistResponse
      additionalProperties: false
      description: 'Данные GameRadar: WatchlistResponse.'
    DecimalValue:
      type: string
      format: decimal
      pattern: ^[0-9]+(?:\.[0-9]+)?$
      description: Точная неотрицательная десятичная строка без потери точности.
      examples:
      - '3.99'
    MoneyTarget:
      description: 'Неотрицательный порог USD: максимум 9999999999.99, не более 2
        дробных цифр. Можно передать JSON-число или точную десятичную строку.'
      anyOf:
      - type: number
        minimum: 0
        maximum: 9999999999.99
        multipleOf: 0.01
      - type: string
        format: decimal
      examples:
      - '4.00'
      - 4
    ProblemDetails:
      type: object
      additionalProperties: false
      description: Ошибка RFC 9457; секреты и введённые значения не возвращаются.
      required:
      - type
      - title
      - status
      - detail
      - instance
      - traceId
      - code
      properties:
        type:
          type: string
          description: URI типа ошибки.
        title:
          type: string
          description: Краткое название ошибки.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP-статус.
        detail:
          type: string
          description: Безопасное описание ошибки.
        instance:
          type: string
          description: URI отдельного события ошибки (urn:uuid).
        traceId:
          type: string
          format: uuid
          description: Идентификатор трассировки.
        code:
          type: string
          description: Стабильный код ошибки.
    ValidationIssue:
      type: object
      additionalProperties: false
      required:
      - field
      - type
      - message
      properties:
        field:
          type: string
          description: Путь неверного поля.
        type:
          type: string
          description: Тип нарушения.
        message:
          type: string
          description: Описание нарушения без введённого значения.
    ValidationProblemDetails:
      description: Ошибка валидации запроса.
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      - type: object
        required:
        - errors
        properties:
          errors:
            type: array
            description: Нарушения ограничений.
            items:
              $ref: '#/components/schemas/ValidationIssue'
    HealthResponse:
      type: object
      additionalProperties: false
      description: Готовность базы данных и выбранный источник цен.
      required:
      - status
      - database
      - priceSource
      - mockPricesAreFictional
      properties:
        status:
          type: string
          enum:
          - ok
          description: Сервис готов.
        database:
          type: string
          enum:
          - ready
          description: БД доступна, схема установлена.
        priceSource:
          type: string
          enum:
          - mock
          - cheapshark
          description: Источник цен.
        mockPricesAreFictional:
          type: boolean
          description: Цены mock вымышленные.
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
servers:
- url: http://localhost:8000
  description: Локальный сервис

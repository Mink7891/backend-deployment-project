openapi: 3.1.0
info:
  title: GameRadar API
  version: 0.2.0
  description: Радар цен на игры для общего аккаунта. JSON использует camelCase. Цены
    возвращаются точными десятичными строками в USD. Доступ к игровым операциям по
    X-API-Key. История содержит собственные наблюдения сервиса. Уведомления пока хранятся
    в БД; Telegram будет добавлен позже. В mock-режиме цены вымышленные. Прежние snake_case
    имена полей тела запроса принимаются для совместимости, ответы используют только
    camelCase.
paths:
  /games/search:
    get:
      tags:
      - Games
      summary: Поиск игр
      operationId: searchGames
      security:
      - APIKeyHeader: []
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: .*\S.*
          title: Query
        description: Непустая строка поиска, 1–100 символов.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 60
          minimum: 1
          default: 20
          title: Limit
        description: Максимальное число записей в ответе.
      responses:
        '200':
          description: Успешное выполнение.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameCard'
                title: Response Search Games Games Search Get
        '422':
          description: Неверные параметры запроса.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Неверный или отсутствующий API-ключ.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            WWW-Authenticate:
              description: Используемая схема аутентификации.
              schema:
                type: string
        '500':
          description: Внутренняя ошибка.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: БД или провайдер временно недоступны.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          headers:
            Retry-After:
              description: Секунды до повтора при отказе провайдера.
              schema:
                type: string
      description: Поиск у провайдера и сохранение метаданных в локальный каталог.
  /games/{game_id}:
    get:
      tags:
      - Games
      summary: Цены игры
      operationId: getGame
      security:
      - APIKeyHeader: []
      parameters:
      - name: game_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{1,32}$
          title: Game Id
        description: 'Идентификатор CheapShark: от 1 до 32 цифр, это не Steam App
          ID.'
      responses:
        '200':
          description: Успешное выполнение.
          content:

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: game-radar
    metrics_path: /metrics
    static_configs:
      - targets: [app:8000]
  - job_name: postgres
    static_configs:
      - targets: [postgres_exporter:9187]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

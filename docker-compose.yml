x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  API_KEY: ${API_KEY:?Set API_KEY in .env}
  PRICE_SOURCE: ${PRICE_SOURCE:-cheapshark}
  REFRESH_INTERVAL_SECONDS: ${REFRESH_INTERVAL_SECONDS:-3600}
  REFRESH_MIN_INTERVAL_SECONDS: ${REFRESH_MIN_INTERVAL_SECONDS:-300}
  CHEAPSHARK_BASE_URL: ${CHEAPSHARK_BASE_URL:-https://www.cheapshark.com/api/1.0}
  CHEAPSHARK_USER_AGENT: ${CHEAPSHARK_USER_AGENT:-GameRadar-Educational/0.1}

x-app: &app
  image: game-radar:dev
  build: .
  restart: unless-stopped
  environment: *app-environment

services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    <<: *app
    command: [sh, -c, 'alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000']
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  worker:
    <<: *app
    command: [python, -m, game_radar.worker]
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:

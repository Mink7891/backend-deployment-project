x-app: &app
  # Локально образ собирается из Dockerfile; на машине деплоя IMAGE_NAME и IMAGE_TAG
  # задаёт Jenkins, и образ скачивается из реестра.
  image: ${IMAGE_NAME:-game-radar}:${IMAGE_TAG:-latest}
  build: .
  restart: unless-stopped
  # Все настройки приложения и их значения по умолчанию — в game_radar/config.py.
  env_file: .env

services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    <<: *app
    command: [sh, -c, 'alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000']
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  worker:
    <<: *app
    command: [python, -m, game_radar.worker]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import os, time; from game_radar.config import settings; assert time.time() - os.path.getmtime(settings.WORKER_HEARTBEAT_PATH) < 4 * settings.WORKER_HEARTBEAT_INTERVAL_SECONDS"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backup:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    command: [sh, /scripts/backup.sh]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - ./scripts:/scripts:ro
      - postgres_backups:/backups
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      # Свежая копия (не старше 25 часов) должна существовать.
      test: [CMD-SHELL, 'find /backups -name "*.sql.gz" -mmin -1500 | grep -q .']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9090/-/ready']
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.4.11
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  postgres_backups:
  prometheus_data:
  grafana_data:
